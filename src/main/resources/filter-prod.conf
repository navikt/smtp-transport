ebmsFilter {
  # Hver tjeneste har sin egen CPA-liste. cpaIdsFile peker paa en tekstfil paa classpath
  # (en CPA-id per linje, # for kommentar), eller "all" for aa akseptere alle CPA-ider.
  # forwardTo = "EMOTTAK" er tillatt for aa dokumentere tjenester eksplisitt, men krever cpaIdsFile = "all".
  services = [
    { name = "Inntektsforesporsel", forwardTo = "EBMS", cpaIdsFile = "cpa/prod/inntektsforesporsel.txt" },
    { name = "Trekkopplysning", forwardTo = "EBMS", cpaIdsFile = "cpa/prod/trekkopplysning.txt" },

    { name = "urn:oasis:names:tc:ebxml-msg:service", forwardTo = "BOTH", cpaIdsFile = "all" }
  ]
}

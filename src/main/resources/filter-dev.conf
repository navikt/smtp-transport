# Hver tjeneste i lista skal rute meldinger til NYE Emottak.
# Tjenester som ikke er listet, vil rute meldinger til GAMLE Emottak.
#  both=false betyr at angitte meldinger (selection) rutes KUN til nye Emottak,
#  both=true betyr at angitte meldinger rutes BÅDE til nye og gamle Emottak.
# Utvalget av meldinger som skal rutes ihht mode, bestemmes av selection, whitelist og blacklist
#  selection="all" betyr at alle meldinger for tjenesten rutes ihht. mode
#  selection="percentageNN" betyr at NN prosent (heltall < 100) rutes ihht. mode, resten til gamle Emottak
#  selection="lastDigitN" betyr at CPA-IDer med sistesiffer lik N (kan angi flere) rutes ihht. mode, resten til gamle Emottak
#  selection="none" betyr at ingen CPA-IDer rutes ihht. mode. Brukes sammen med whitelist, eller for å dokumentere tjenester til gamle Emottak eksplisitt
# Alle konfigurasjoner må angi mode og selection.
#  Dersom blacklist er angitt, vil CPA-IDene i lista IKKE inkluderes, uansett selection-setting, disse rutes alltid til GAMLE Emottak
#  Dersom whitelist er angitt, vil CPA-IDene i lista ALLTID inkluderes, uansett selection-setting, disse rutes alltid til NYE Emottak
#  blacklist/whitelist peker på en tekstfil på classpath (innhold: en CPA-id per linje, # for kommentar)
services = [
  { name = "urn:oasis:names:tc:ebxml-msg:service", both=true, selection = "all" },

  { name = "Inntektsforesporsel", both=false, selection = "all" },
  { name = "Trekkopplysning", both=false, selection = "all" },
  { name = "Sykmelding", both=false, selection = "all" },
  { name = "Legemelding", both=false, selection = "all" },
  { name = "HarBorgerFrikortMengde", both=false, selection = "all" },
  { name = "PasientlisteForesporsel", both=false, selection = "all" },

  #Isyfo
  { name = "DialogmoteInnkalling", both=true, selection = "all" },
  { name = "ForesporselFraSaksbehandler", both=true, selection = "all" },
  { name = "HenvendelseFraLege", both=true, selection = "all" },
  { name = "HenvendelseFraSaksbehandler", both=true, selection = "all" },
  { name = "Oppfolgingsplan", both=true, selection = "all" },

  # helseref - KUHR
  { name = "BehandlerKrav", both=true, selection = "none" },
  { name = "S-KUHR_AKTIVITET", both=true, selection = "all" },
  { name = "S-KUHR_KODEVERK", both=true, selection = "all" },
  { name = "S-KUHR_PERSONIDENT", both=true, selection = "all" },
  { name = "S-KUHR_SAMHANDLER", both=true, selection = "all" },
  { name = "Sykdomspulsen", both=true, selection = "all" },

  # Helseref - eresept
  { name = "Legemiddelinformasjon", both=true, selection = "all" },
  { name = "OppgjorsKontroll", both=true, selection = "none" },
  { name = "Prisinformasjon", both=true, selection = "all" }
]
